# .github/release.yml

changelog:
  exclude:
    labels:
      - pipeline
      - wontfix
  categories:
    - title: ✨ Enhancements
      labels:
        - enhancement
    - title: 🪲🔨 Bug Fixes
      labels:
        - bug
    - title: ⚠️ Security and Dependencies
      labels:
        - dependencies
